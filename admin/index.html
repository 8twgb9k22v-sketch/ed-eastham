<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed Eastham, site editor</title>
<meta name="robots" content="noindex">
</head>
<body>
<!-- The login service lives on Netlify; the editor lives here with the site. Start the login widget pointing at Netlify before the editor loads. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  window.netlifyIdentity.init({ APIUrl: 'https://ed-eastham.netlify.app/.netlify/identity' });
</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
