<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ed Eastham</title>
<meta name="description" content="Ed Eastham, artist. Charcoal and painted portraits, figurative works, life drawings, mixed media and pen and ink.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23f6f5f2%27/%3E%3Cg fill=%27%23161615%27%3E%3Crect x=%2746%27 y=%2710%27 width=%278%27 height=%2780%27/%3E%3Crect x=%2710%27 y=%2710%27 width=%2780%27 height=%278%27/%3E%3Crect x=%2710%27 y=%2782%27 width=%2780%27 height=%278%27/%3E%3Crect x=%2726%27 y=%2746%27 width=%2748%27 height=%278%27/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:title" content="Ed Eastham, artist">
<meta property="og:description" content="Portraits and figurative work in charcoal, oil and mixed media.">
<meta property="og:image" content="https://edeastham.co.uk/assets/work/work-03.jpg">
<meta name="theme-color" content="#f6f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--accent:#161615;--bg:#f6f5f2;--ink:#161615;--muted:#6a6964;--line:rgba(22,22,21,.14);--soft:#ebe9e4;--hdr:rgba(246,245,242,.82);--shadow:rgba(22,22,21,.12);--font:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);--gutter:22px}
@media (min-width:700px){:root{--gutter:40px}} @media (min-width:1100px){:root{--gutter:56px}} @media (min-width:1500px){:root{--gutter:72px}}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light only;background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
.skip{position:fixed;left:16px;top:-60px;z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;font-size:14px;transition:top .2s}
.skip:focus{top:16px}
.mark{display:block;fill:currentColor}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.ul{border-bottom:1px solid var(--ink);padding-bottom:1px;transition:opacity .25s} .ul:hover{opacity:.55}
#brand img,#stage .logo img{display:block;object-fit:contain} #brand img{height:30px;width:auto} #stage .logo img{width:clamp(180px,26vw,320px);height:auto}
.cta,.page .cta{border-color:var(--accent);color:var(--accent)} .cta:hover,.page .cta:hover{background:var(--accent);color:var(--bg)} .contact-big,.ul,.works figcaption .enq{border-color:var(--accent)} .nextcat a i,.nextcat a i::after{background:var(--accent);border-color:var(--accent)}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:20px var(--gutter);pointer-events:none;transition:padding .35s var(--ease)}
header::before{content:"";position:absolute;inset:0;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);opacity:0;transition:opacity .35s}
body.scrolled header{padding:12px var(--gutter)} body.scrolled header::before{opacity:1}
body.menu header::before{opacity:0}
header>*{position:relative}
header>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:14px;color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .5s var(--ease)}
body.inner #brand,body.ready #brand{opacity:1;transform:none}
#brand .mark{width:26px;height:26px}
#brand span{font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:500}
#burger{width:44px;height:44px;display:grid;place-items:center;position:relative;margin-right:-10px}
#burger i{position:absolute;left:11px;width:22px;height:1.5px;background:var(--ink);transition:transform .4s var(--ease),opacity .25s,top .4s var(--ease)}
#burger i:nth-child(1){top:15px} #burger i:nth-child(2){top:21px} #burger i:nth-child(3){top:27px}
body.menu #burger i:nth-child(1){top:21px;transform:rotate(45deg)} body.menu #burger i:nth-child(2){opacity:0} body.menu #burger i:nth-child(3){top:21px;transform:rotate(-45deg)}

/* menu */
#menu{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 var(--gutter);visibility:hidden;opacity:0;transition:opacity .35s var(--ease),visibility 0s linear .35s}
body.menu #menu{visibility:visible;opacity:1;transition:opacity .35s var(--ease),visibility 0s}
#menu ul{list-style:none;display:grid;max-width:560px}
#menu li>a,#menu li>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 0;font-size:clamp(30px,4.2vw,52px);font-weight:300;letter-spacing:-.015em;line-height:1.1;border-bottom:1px solid var(--line);text-align:left;transform:translateY(12px);opacity:0;transition:transform .6s var(--ease),opacity .45s,color .3s}
#menu li>a:hover,#menu li>button:hover{color:var(--muted)}
body.menu #menu li>a,body.menu #menu li>button{transform:none;opacity:1}
#menu li:nth-child(2)>*{transition-delay:.05s} #menu li:nth-child(3)>*{transition-delay:.1s} #menu li:nth-child(4)>*{transition-delay:.15s} #menu li:nth-child(5)>*{transition-delay:.2s}
#menu .chev{width:13px;height:13px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-3px,-3px);transition:transform .4s var(--ease);margin-right:8px}
#menu li.open .chev{transform:rotate(-135deg) translate(-4px,-4px)}
#menu .sub{list-style:none;display:grid;max-height:0;overflow:hidden;transition:max-height .5s var(--ease)}
#menu li.open .sub{max-height:460px}
#menu .sub a{display:flex;justify-content:space-between;padding:10px 0 10px 26px;font-size:19px;font-weight:300;color:var(--muted);border-bottom:1px solid var(--line);transition:color .25s,padding .35s var(--ease)}
#menu .sub li:last-child a{border-bottom:0;margin-bottom:8px}
#menu .sub a:hover,#menu .sub a[aria-current]{color:var(--ink);padding-left:34px}
#menu .sub a small{font-size:12px;letter-spacing:.1em;color:var(--muted)}
#menu .side{display:grid;gap:22px;justify-items:end;text-align:right;color:var(--muted);font-size:15px}
#menu .side p{max-width:30ch;line-height:1.5}
#menu .side .mark{width:72px;height:72px;color:var(--ink)}
#menu .side a{border-bottom:1px solid var(--line);transition:color .25s,border-color .25s} #menu .side a:hover{color:var(--ink);border-color:var(--ink)}

/* home stage */
#stage{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden}
#stage .logo{position:relative;z-index:2;display:grid;justify-items:center;gap:26px;color:var(--ink);text-align:center}
#stage .logo .mark{width:clamp(120px,15vw,176px);height:auto}
#stage .logo .mark rect{transform-origin:center;transform:scaleX(0);transition:transform .9s var(--ease)}
#stage .logo .mark rect.v{transform:scaleY(0)}
body.ready #stage .logo .mark rect{transform:none}
body.ready #stage .logo .mark rect:nth-child(2){transition-delay:.25s} body.ready #stage .logo .mark rect:nth-child(3){transition-delay:.4s} body.ready #stage .logo .mark rect:nth-child(4){transition-delay:.55s}
#stage .logo .word{font-size:clamp(14px,1.4vw,17px);letter-spacing:.38em;text-transform:uppercase;font-weight:500;padding-left:.38em;opacity:0;transition:opacity .8s ease .6s}
#stage .logo .role{display:none}
body.ready #stage .logo .word,body.ready #stage .logo .role{opacity:1}
.slot{position:absolute;z-index:1;overflow:hidden;background:var(--soft);opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1.2s var(--ease)}
body.ready .slot{opacity:1;transform:none}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.slot img.on{opacity:1}
.slot a{position:absolute;inset:0}
.s1{left:var(--gutter);top:50%;transform:translateY(-50%) translateY(14px);width:clamp(180px,22vw,340px);aspect-ratio:4/5;transition-delay:.9s}
.s2{right:var(--gutter);top:50%;transform:translateY(-50%) translateY(14px);width:clamp(180px,22vw,340px);aspect-ratio:4/5;transition-delay:1.1s}
body.ready .s1,body.ready .s2{transform:translateY(-50%)}
.s3,.s4,.s5{display:none}
#stage .tag{font-size:clamp(15px,1.3vw,18px);color:var(--muted);max-width:34ch;line-height:1.5;opacity:0;transition:opacity .8s ease .9s}
body.ready #stage .tag{opacity:1}
.slot .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;font-size:12px;letter-spacing:.06em;color:var(--bg);background:linear-gradient(180deg,rgba(22,22,21,0),rgba(22,22,21,.55));opacity:0;transition:opacity .3s}
.slot:hover .cap{opacity:1}
#selected{padding:80px var(--gutter) 30px}
#selected .row,#cats .row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:20px;margin-bottom:28px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#selected h2,#cats h2{font-size:clamp(22px,2.4vw,30px);font-weight:300;letter-spacing:-.01em}
.sel{display:grid;grid-template-columns:repeat(6,1fr);gap:40px 28px}
.sel a{grid-column:span 2} .sel a:nth-child(1){grid-column:span 3} .sel a:nth-child(2){grid-column:span 3} .sel a:nth-child(1) .im,.sel a:nth-child(2) .im{aspect-ratio:5/4}
.sel a{display:grid;gap:12px}
.sel .im{aspect-ratio:4/5;overflow:hidden;background:var(--soft)}
.sel .im img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.sel a:hover .im img{transform:scale(1.02)}
.sel .c{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:14px} .sel .c em{font-style:italic} .sel .c span{color:var(--muted)}
#stage .hint{position:absolute;bottom:26px;left:var(--gutter);z-index:2;font-size:13px;color:var(--muted);opacity:0;transition:opacity .8s ease 1.4s}
body.ready #stage .hint{opacity:1}
#cats{padding:60px var(--gutter) 80px}
#comm{margin:0 var(--gutter) 100px;padding-top:56px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(30px,5vw,60px);align-items:center}
#comm h2{font-size:clamp(28px,3.4vw,44px);font-weight:300;letter-spacing:-.015em;line-height:1.1;margin-bottom:18px}
#comm p{max-width:48ch;color:var(--muted);margin-bottom:28px}
#comm .im{aspect-ratio:4/5;max-height:70vh;overflow:hidden;background:var(--soft);justify-self:end;width:100%;max-width:520px}
#comm .im img{width:100%;height:100%;object-fit:cover}
.catlist{list-style:none;border-top:1px solid var(--line)}
.catlist a{display:grid;grid-template-columns:180px 1fr auto;gap:32px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);transition:padding .35s var(--ease)}
.catlist a:hover{padding-left:12px}
.catlist .im{width:180px;aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.catlist .im img{width:100%;height:100%;object-fit:cover}
.catlist .t{font-size:clamp(22px,2.6vw,36px);font-weight:300}
.catlist .n{font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

/* pages */
main{min-height:100vh;min-height:100dvh}
.page{max-width:1320px;margin:0 auto;padding:124px 22px 100px;padding-left:var(--gutter);padding-right:var(--gutter);animation:rise .55s var(--ease) both}
main.out{opacity:0;transition:opacity .18s ease}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .8s var(--ease)} .rv.in{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page h1{font-size:clamp(36px,4.8vw,64px);font-weight:300;letter-spacing:-.02em;line-height:1;margin-bottom:48px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.sec{margin-top:72px} .sec .label{display:block;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:10px;margin-bottom:22px}
.intro{max-width:56ch;font-size:19px;color:var(--muted);margin:-18px 0 48px}
.crumbs a:hover{color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(36px,5vw,60px);align-items:start}
.text{max-width:60ch;display:grid;gap:20px;font-size:19px}
.text p{color:var(--ink)}
.portrait{aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover}
.cta{display:inline-flex;align-items:center;height:50px;padding:0 24px;border:1px solid var(--ink);font-size:15px;font-weight:400;transition:background .3s,color .3s}
.cta:hover{background:var(--ink);color:var(--bg)}
.steps{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:56px 0 40px}
.steps li{padding:30px 28px 34px 0;border-right:1px solid var(--line);counter-increment:s}
.steps li:last-child{border-right:0} .steps li+li{padding-left:28px}
.steps li::before{content:"0" counter(s);display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px}
.steps b{display:block;font-weight:400;font-size:22px;margin-bottom:10px}
.steps p{color:var(--muted);font-size:16px}
.works{display:grid;grid-template-columns:1fr;gap:96px;max-width:1180px;margin:0 auto}
.works figure{width:100%}
.works figure{cursor:zoom-in}
.works .im{display:flex;justify-content:center;background:transparent}
.works .im img{width:auto;max-width:100%;max-height:86vh;height:auto;opacity:0;transition:opacity .6s ease,transform 1s var(--ease),filter .6s ease;box-shadow:0 24px 50px var(--shadow)}
.works .im img.lq{opacity:1;filter:blur(14px);transform:scale(1.02)}
.works .im img.ld{opacity:1}
.works figure:hover .im img{transform:scale(1.015)}
.works figcaption{margin:18px auto 0;display:grid;grid-template-columns:1fr auto;gap:14px;font-size:15px;max-width:760px;align-items:end}
.works figcaption .enq{font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap}
.works figcaption em{font-style:italic;font-weight:300}
.works figcaption span{color:var(--muted)}
.works figcaption .price{color:var(--ink);font-weight:400}
.empty{padding:80px 0;border-top:1px solid var(--line);font-size:20px;color:var(--muted)}
.nextcat{margin-top:90px;padding-top:26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.nextcat a{font-size:clamp(22px,2.6vw,34px);font-weight:300;display:inline-flex;align-items:center;gap:14px;transition:gap .35s var(--ease)} .nextcat a:hover{gap:24px}
.nextcat a i{width:34px;height:1px;background:var(--ink);position:relative} .nextcat a i::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg)}
.catlist .n{display:inline-flex;align-items:center;gap:14px} .catlist .n i{width:0;height:1px;background:var(--ink);transition:width .35s var(--ease)} .catlist a:hover .n i{width:28px}
.contact-big{font-size:clamp(26px,4vw,56px);font-weight:300;letter-spacing:-.02em;margin:10px 0 40px;display:block;width:max-content;max-width:100%;border-bottom:1px solid var(--ink);padding-bottom:4px;transition:opacity .25s}
.contact-big:hover{opacity:.6}
form{display:grid;gap:22px;max-width:560px}
form label{display:grid;gap:8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
form input,form textarea{font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:8px 0;border-radius:0;outline:none}
form textarea{min-height:120px;resize:vertical}
form input:focus,form textarea:focus{border-bottom-width:1.5px}
.note{font-size:15px;color:var(--muted);max-width:60ch;margin-top:30px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:1fr auto;visibility:hidden;opacity:0;transition:opacity .35s,visibility 0s linear .35s}
#lb.open{visibility:visible;opacity:1;transition:opacity .35s,visibility 0s}
#lb .view{display:grid;place-items:center;padding:70px var(--gutter) 10px}
#lb img{max-width:100%;max-height:calc(100dvh - 190px);object-fit:contain;box-shadow:0 30px 60px var(--shadow);cursor:zoom-in;transition:transform .45s var(--ease);transform-origin:var(--zx,50%) var(--zy,50%)}
#lb.zoom img{transform:scale(2.2);cursor:zoom-out}
#lb .bar,#lb .strip{transition:opacity .3s} #lb.zoom .bar,#lb.zoom .strip{opacity:0;pointer-events:none}
#lb .zoomhint{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#lb .bar{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;padding:10px var(--gutter) 24px}
#lb .cap{font-size:15px;display:grid;gap:2px} #lb .cap em{font-style:italic} #lb .cap span{color:var(--muted)}
#lb .nav{display:flex;gap:6px}
#lb .nav button,#lbClose{height:40px;padding:0 16px;border:1px solid var(--line);font-size:14px;color:var(--ink);transition:background .25s,color .25s,border-color .25s}
#lb .nav button:hover,#lbClose:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#lbClose{position:fixed;top:16px;right:var(--gutter)}
#lb .strip{display:flex;gap:8px;padding:0 var(--gutter) 22px;overflow-x:auto}
#lb .strip button{width:46px;aspect-ratio:4/5;flex:0 0 auto;overflow:hidden;opacity:.5;transition:opacity .25s;border:1px solid transparent}
#lb .strip button.on{opacity:1;border-color:var(--ink)} #lb .strip button:hover{opacity:1}
#lb .strip img{width:100%;height:100%;object-fit:cover}

footer{padding:56px var(--gutter) 30px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px;font-size:14px;color:var(--muted)}
footer a:hover{color:var(--ink)}
footer .mark{width:26px;height:26px;color:var(--ink)}
footer .l{display:grid;gap:14px;align-content:start;max-width:34ch}
footer .l b{font-weight:500;color:var(--ink);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
footer .col{display:grid;gap:8px;align-content:start} footer .col b{font-weight:500;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:6px}
footer .bottom{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.04em}
.cv{list-style:none;display:grid;border-top:1px solid var(--line)} .cv li{display:grid;grid-template-columns:90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px} .cv li span:first-child{color:var(--muted)}

@media (max-width:900px){#comm{grid-template-columns:1fr;gap:30px} #comm .im{justify-self:start;max-height:60vh} .two{grid-template-columns:1fr;gap:36px} .works{grid-template-columns:1fr;gap:44px} .steps{grid-template-columns:1fr} .steps li{border-right:0;border-bottom:1px solid var(--line);padding:24px 0} .steps li+li{padding-left:0} .steps li:last-child{border-bottom:0} #menu{grid-template-columns:1fr} #menu .side{display:none}}
@media (max-width:640px){
  header{padding:14px 18px} :root{--gutter:18px} .page{padding-top:100px}
  #stage .logo .mark{width:118px}
  .s1{left:4%;top:9%;width:32vw} .s2{right:5%;top:7%;width:26vw} .s3{left:8%;bottom:8%;width:26vw;aspect-ratio:1} .s4{right:6%;bottom:7%;width:34vw} .s5{display:none}
  #stage .hint{display:none}
  .catlist a{grid-template-columns:70px 1fr auto;gap:16px} .catlist .im{width:70px}
  .page{padding-top:100px} .page h1{margin-bottom:30px}
  #lb .view{padding:64px 18px 8px} #lb img{max-height:calc(100dvh - 210px)}
  footer{grid-template-columns:1fr;gap:24px} .sel{grid-template-columns:1fr 1fr;gap:20px 14px} .sel a,.sel a:nth-child(1),.sel a:nth-child(2){grid-column:span 1} .sel a:nth-child(1) .im,.sel a:nth-child(2) .im{aspect-ratio:4/5} .s1,.s2{width:36vw;top:auto;bottom:6%;transform:none} .s1{left:var(--gutter)} .s2{right:var(--gutter)} body.ready .s1,body.ready .s2{transform:none} #stage{padding-bottom:40vw} #stage .tag{font-size:15px;padding:0 10px}
}
body.menu,body.lbopen{overflow:hidden}
@media (max-width:640px){
  .works{gap:56px} .works .im img{max-height:74vh;box-shadow:0 14px 30px rgba(22,22,21,.1)} .works figcaption{font-size:15px}
  .catlist a{grid-template-columns:96px 1fr;gap:14px;padding:14px 0} .catlist .im{width:96px} .catlist .n{grid-column:2;font-size:11px}
  #lb .bar{grid-template-columns:1fr;gap:12px;padding:8px 18px 12px} #lb .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #lb .nav button,#lbClose{height:46px;font-size:15px} #lb .strip button{width:54px}
  #burger{width:48px;height:48px} #menu li>a,#menu li>button{padding:14px 0} #menu .sub a{padding:12px 0 12px 22px;font-size:18px}
  form input,form textarea{font-size:17px}
  .cta{height:52px;width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ee" viewBox="0 0 100 100"><rect class="v" x="46" y="10" width="8" height="80"/><rect x="10" y="10" width="80" height="8"/><rect x="10" y="82" width="80" height="8"/><rect x="26" y="46" width="48" height="8"/></symbol></svg>

<a class="skip" href="#main">Skip to content</a>
<header>
  <a id="brand" href="#/" aria-label="Ed Eastham, home"><svg class="mark"><use href="#ee"/></svg><span id="brandName"></span></a>
  <button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
</header>

<nav id="menu" aria-label="Site">
  <ul>
    <li><a href="#/about">About</a></li>
    <li id="pfItem"><button id="pfToggle" aria-expanded="false">Portfolio <span class="chev" aria-hidden="true"></span></button><ul class="sub" id="pfSub"></ul></li>
    <li><a href="#/commission">Commission</a></li>
    <li><a href="#/shop">Shop</a></li>
    <li><a href="#/contact">Contact</a></li>
  </ul>
  <div class="side"><svg class="mark" aria-hidden="true"><use href="#ee"/></svg><div id="menuFoot"></div></div>
</nav>

<main id="main"><noscript><p style="padding:120px 24px">This site needs JavaScript to show the works. Please enable it, or email hello@edeastham.example.</p></noscript></main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Artwork">
  <div class="view"><img id="lbImg" alt=""></div>
  <div class="bar"><div class="cap" id="lbCap"></div><div class="nav"><button id="lbPrev">Previous</button><button id="lbNext">Next</button></div></div>
  <div class="strip" id="lbStrip"></div>
  <button id="lbClose" aria-label="Close">Close</button>
</div>

<script>
/* Netlify Identity links (invites, password resets) land on the site root; hand them to the editor page */
if (/(invite|recovery|confirmation|email_change)_token=/.test(location.hash)){
  const w = document.createElement('script'); w.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
  w.onload = () => { const ni = window.netlifyIdentity; if (!ni) return; ni.on('login', () => { document.location.href = '/admin/'; }); };
  document.head.appendChild(w);
}
/* All words and works live in content/site.json. Edit that file to change the site. */
const HASH = !!window.HASH_MODE || location.protocol === 'file:';
const pathOf = () => HASH ? location.hash.replace(/^#\/?/, '') : location.pathname.replace(/^\/ed-eastham(?=\/|$)/, '').replace(/^\/+|\/+$/g, '');
let S = null, timers = [], lbList = [], lbIdx = 0, lastFocus = null;
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const SUB = (location.pathname.match(/^\/ed-eastham(?=\/|$)/) || [''])[0];   /* '' on the real domain, '/ed-eastham' on github.io */
const ROOT = HASH ? '' : SUB + '/';
const work = f => ROOT + 'assets/work/' + f;
const allWorks = () => S.categories.flatMap(c => c.works.map(w => Object.assign({ cat: c }, w)));
const findWork = f => allWorks().find(w => w.file === f);
const capOf = w => [w.medium, w.size, w.year].filter(Boolean).join(', ');

function go(){ main.classList.add('out'); setTimeout(() => { render(); main.classList.remove('out'); }, 180); }
function navigate(path){ if (HASH){ location.hash = '#' + path; return; } const full = SUB + path; if (location.pathname === full){ render(); return; } history.pushState(null, '', full); go(); }
fetch(ROOT + 'content/site.json').then(r => r.json()).then(data => {
  S = data; applySettings(); buildMenu();
  if (HASH) addEventListener('hashchange', go);
  else { if (/^#\//.test(location.hash)) history.replaceState(null, '', location.hash.slice(1)); addEventListener('popstate', go); }
  document.addEventListener('click', e => { if (HASH) return; const a = e.target.closest('a[href]'); if (!a || e.metaKey || e.ctrlKey || a.target === '_blank') return; const h = a.getAttribute('href'); if (/^#\//.test(h)){ e.preventDefault(); navigate(h.slice(1)); } else if (/^\/(?!\/)/.test(h)){ e.preventDefault(); navigate(h.replace(/^\/ed-eastham(?=\/|$)/, '')); } });
  render();
});
addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 40), { passive:true });
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold:.12, rootMargin:'0px 0px -6% 0px' });
function reveal(){ main.querySelectorAll('.sel a, .catlist li, .works figure, .steps li, #comm > *').forEach((el, i) => { el.classList.add('rv'); el.style.transitionDelay = (i % 6) * 60 + 'ms'; io.observe(el); }); }

function applySettings(){
  const st = S.settings || {}; const c = st.colours || {}; const r = document.documentElement.style;
  if (c.background) r.setProperty('--bg', c.background); if (c.text) r.setProperty('--ink', c.text); if (c.accent) r.setProperty('--accent', c.accent);
  if (c.background && c.text){ r.setProperty('--muted', mix(c.text, c.background, .62)); r.setProperty('--line', hexToRgba(c.text, .14)); r.setProperty('--soft', mix(c.text, c.background, .06)); r.setProperty('--hdr', hexToRgba(c.background, .82)); }
  const faces = { 'Hanken Grotesk': '"Hanken Grotesk","Helvetica Neue",Arial,sans-serif', 'Instrument Sans': '"Instrument Sans","Helvetica Neue",Arial,sans-serif', 'DM Sans': '"DM Sans","Helvetica Neue",Arial,sans-serif', 'Cormorant Garamond': '"Cormorant Garamond",Georgia,serif' };
  if (st.typeface && faces[st.typeface]) r.setProperty('--font', faces[st.typeface]);
  if (st.typeface === 'Cormorant Garamond') document.body.style.fontSize = '20px';
  const L = st.labels || {}; document.querySelectorAll('#menu a[href="#/about"]').forEach(a => a.textContent = L.about || 'About');
  document.querySelectorAll('#menu a[href="#/commission"]').forEach(a => a.textContent = L.commission || 'Commission');
  document.querySelectorAll('#menu a[href="#/shop"]').forEach(a => a.textContent = L.shop || 'Shop');
  document.querySelectorAll('#menu a[href="#/contact"]').forEach(a => a.textContent = L.contact || 'Contact');
  const pf = document.getElementById('pfToggle'); if (pf) pf.childNodes[0].textContent = (L.portfolio || 'Portfolio') + ' ';
  const lg = (st.logo || {}); if (lg.style === 'image' && lg.image){ const b = document.getElementById('brand'); b.querySelector('svg').replaceWith(Object.assign(new Image(), { src: work(lg.image.replace(/^.*assets\/work\//, '')), alt: S.name })); }
}
function hexToRgba(h, a){ const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function mix(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const ch = s => Math.round(((A >> s) & 255) * t + ((B >> s) & 255) * (1 - t)); return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join(''); }
const lbl = k => ((S.settings || {}).labels || {})[k] || { about:'About', portfolio:'Portfolio', commission:'Commission', shop:'Shop', contact:'Contact' }[k];
const socialLinks = () => ((S.settings || {}).social || []).filter(x => x && x.url).map(x => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label || 'Link') + '</a>').join('');
function buildMenu(){
  document.getElementById('brandName').textContent = S.wordmark;
  document.getElementById('pfSub').innerHTML = S.categories.map(c => '<li><a href="#/portfolio/' + c.slug + '">' + esc(c.title) + '<small>' + (c.works.length || 'soon') + '</small></a></li>').join('');
  document.getElementById('menuFoot').innerHTML = '<p>' + esc(S.tagline || '') + '</p><div style="display:grid;gap:8px"><a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>' + (S.instagram ? '<a href="' + esc(S.instagram) + '" target="_blank" rel="noopener">Instagram</a>' : '') + '</div>';
}
const burger = document.getElementById('burger');
function setMenu(open){ const was = document.body.classList.contains('menu'); document.body.classList.toggle('menu', open); burger.setAttribute('aria-expanded', open); if (open) setTimeout(() => { const f = document.querySelector('#menu a, #menu button'); if (f) f.focus(); }, 60); else if (was) burger.focus(); }
addEventListener('keydown', e => { if (e.key !== 'Tab') return; const trap = document.body.classList.contains('menu') ? document.getElementById('menu') : (document.getElementById('lb').classList.contains('open') ? document.getElementById('lb') : null); if (!trap) return; const f = [...trap.querySelectorAll('a[href], button:not([disabled])')].filter(el => el.offsetParent !== null || el === document.getElementById('lbClose')); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } });
/* swipe between works on touch screens */
let tx = null; document.getElementById('lb').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true }); document.getElementById('lb').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1); }, { passive:true });
burger.addEventListener('click', () => setMenu(!document.body.classList.contains('menu')));
document.getElementById('pfToggle').addEventListener('click', e => { const li = document.getElementById('pfItem'); li.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', li.classList.contains('open')); });
document.getElementById('menu').addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
addEventListener('keydown', e => { const lbOpen = document.getElementById('lb').classList.contains('open'); if (e.key === 'Escape'){ if (lbOpen) closeLb(); else setMenu(false); } if (lbOpen){ if (e.key === 'ArrowRight') stepLb(1); if (e.key === 'ArrowLeft') stepLb(-1); } });

function render(){
  const h = pathOf(); timers.forEach(clearInterval); timers = [];
  closeLb(); setMenu(false);
  const [head, sub] = h.split('/');
  document.body.classList.toggle('inner', !!head); document.body.classList.remove('ready');
  document.querySelectorAll('#menu a').forEach(a => { const t = a.getAttribute('href').replace(/^#?\//, ''); if (t === h) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (head === 'portfolio' && sub && S.categories.some(c => c.slug === sub)) document.getElementById('pfItem').classList.add('open');
  const known = !head || head === 'portfolio' || !!S.pages[head];
  if (!known && !HASH) history.replaceState(null, '', SUB + '/');
  if (!head || !known) home(); else if (head === 'portfolio') sub ? category(sub) : portfolio(); else page(head);
  scrollTo(0, 0);
  const cat = sub && S.categories.find(c => c.slug === sub);
  document.title = (head && known ? ((cat ? cat.title : S.pages[head] ? S.pages[head].title : 'Portfolio') + ', ') : '') + S.name;
  main.querySelectorAll('.works .im img[data-full]').forEach(im => { const full = new Image(); full.src = im.dataset.full; full.onload = () => { im.src = full.src; im.classList.remove('lq'); im.classList.add('ld'); }; full.onerror = () => { im.classList.remove('lq'); im.classList.add('ld'); }; });
  reveal(); document.body.classList.toggle('scrolled', scrollY > 40);
  if (!HASH) document.querySelectorAll('a[href^="#/"]').forEach(a => a.setAttribute('href', SUB + a.getAttribute('href').slice(1)));
}
const foot = () => '<footer><div class="l"><svg class="mark" aria-hidden="true"><use href="#ee"/></svg><b>' + esc(S.name) + '</b><span>' + esc(S.tagline || '') + '</span></div>' +
  '<div class="col"><b>Site</b><a href="#/about">' + esc(lbl('about')) + '</a><a href="#/portfolio">' + esc(lbl('portfolio')) + '</a><a href="#/commission">' + esc(lbl('commission')) + '</a><a href="#/shop">' + esc(lbl('shop')) + '</a><a href="#/contact">' + esc(lbl('contact')) + '</a></div>' +
  '<div class="col"><b>Contact</b><a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>' + (S.instagram ? '<a href="' + esc(S.instagram) + '" target="_blank" rel="noopener">Instagram</a>' : '') + socialLinks() + (S.location ? '<span>' + esc(S.location) + '</span>' : '') + '</div>' +
  '<div class="bottom"><span>All works © ' + esc(S.name) + ' ' + new Date().getFullYear() + '</span><span>' + esc((S.settings || {}).footerLine || '') + '</span></div></footer>';

function home(){
  const feat = S.home.featured.map(f => findWork(f) || { file: f, title: '', cat: { slug: '' } });
  const pool = allWorks();
  const hs = (S.settings || {}).home || {}; const sel = pool.slice(0, hs.selectedCount || 6); const lg = (S.settings || {}).logo || {};
  main.innerHTML = '<section id="stage">' +
    [1,2].map(i => '<div class="slot s' + i + '" data-slot="' + (i - 1) + '"></div>').join('') +
    '<div class="logo">' + (lg.style === 'image' && lg.image ? '<img src="' + work(lg.image.replace(/^.*assets\/work\//, '')) + '" alt="' + esc(S.name) + '">' : '<svg class="mark" aria-hidden="true"><use href="#ee"/></svg><div class="word">' + esc(S.wordmark) + '</div>') + '<p class="tag">' + esc(S.tagline || '') + '</p></div>' +
    '<a class="hint ul" href="#/portfolio">View the portfolio</a></section>' +
    (hs.showSelectedWorks === false ? '' : '<section id="selected"><div class="row"><h2>Selected works</h2><a class="label" href="#/portfolio">All works</a></div><div class="sel">' +
    sel.map(w => '<a href="#/portfolio/' + w.cat.slug + '"><div class="im"><img src="' + work(w.file) + '" alt="' + esc(w.title) + '" loading="lazy"></div><div class="c"><em>' + esc(w.title) + '</em><span>' + esc(w.cat.title) + '</span></div></a>').join('') + '</div></section>') +
    (hs.showCategories === false ? '' : '<section id="cats"><div class="row"><h2>' + esc(lbl('portfolio')) + '</h2><span class="label">' + pool.length + ' works</span></div><ul class="catlist">' +
    S.categories.map(c => '<li><a href="#/portfolio/' + c.slug + '"><div class="im">' + (c.works[0] ? '<img src="' + work(c.works[0].file) + '" alt="" loading="lazy">' : '') + '</div><span class="t">' + esc(c.title) + '</span><span class="n">' + (c.works.length ? c.works.length + (c.works.length === 1 ? ' work' : ' works') : 'Coming soon') + '<i></i></span></a></li>').join('') +
    '</ul></section>') +
    (hs.showCommission === false ? '' : '<section id="comm"><div><h2>Commission a portrait</h2><p>' + esc((S.pages.commission.body || [''])[0]) + '</p><a class="cta" href="#/commission">How it works</a></div><div class="im"><img src="' + work((S.pages.about.image) || pool[0].file) + '" alt="" loading="lazy"></div></section>') + foot();
  /* five slots around the logo, each cycling through the featured works on its own clock */
  const slots = [...main.querySelectorAll('.slot')];
  slots.forEach((slot, k) => {
    const seq = feat.map((_, j) => feat[(j + k) % feat.length]);
    slot.innerHTML = seq.map((w, j) => '<img src="' + work(w.file) + '" alt="' + esc(w.title || 'Artwork') + '"' + (j ? ' loading="lazy"' : '') + (j === 0 ? ' class="on"' : '') + '>').join('') + '<a href="#/portfolio/' + esc(seq[0].cat.slug) + '" aria-label="' + esc(seq[0].cat.title || 'Portfolio') + '"></a><div class="cap">' + esc(seq[0].cat.title || '') + '</div>';
    const imgs = [...slot.querySelectorAll('img')]; let i = 0;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timers.push(setInterval(() => { i = (i + 1) % imgs.length; imgs.forEach((im, j) => im.classList.toggle('on', j === i)); slot.querySelector('a').href = '#/portfolio/' + seq[i].cat.slug; slot.querySelector('.cap').textContent = seq[i].cat.title || ''; }, 5200 + k * 1100));
  });
  main.querySelectorAll('.slot img.on').forEach(im => im.setAttribute('fetchpriority', 'high'));
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
}
function portfolio(){
  main.innerHTML = '<section class="page"><h1>Portfolio</h1><ul class="catlist">' +
    S.categories.map(c => '<li><a href="#/portfolio/' + c.slug + '"><div class="im">' + (c.works[0] ? '<img src="' + work(c.works[0].file) + '" alt="" loading="lazy">' : '') + '</div><span class="t">' + esc(c.title) + '</span><span class="n">' + (c.works.length ? c.works.length + (c.works.length === 1 ? ' work' : ' works') : 'Coming soon') + '<i></i></span></a></li>').join('') + '</ul></section>' + foot();
}
function figures(list, withPrice){
  return list.map((w, i) => '<figure data-i="' + i + '" tabindex="0" role="button" aria-label="View ' + esc(w.title) + ' full size"><div class="im"><img class="lq" src="' + ROOT + 'assets/work/thumbs/' + w.file + '" data-full="' + work(w.file) + '" alt="' + esc(w.title) + (w.medium ? ', ' + esc(w.medium) : '') + '" loading="lazy"></div><figcaption><div><em>' + esc(w.title) + '</em>' + (w.year ? ', ' + esc(w.year) : '') + '<br><span>' + esc([w.medium, w.size].filter(Boolean).join(', ')) + '</span></div>' + (withPrice && w.price ? '<span class="price">' + esc(w.price) + '</span>' : '<a class="enq" href="mailto:' + esc(S.email) + '?subject=' + encodeURIComponent('Enquiry: ' + w.title) + '" onclick="event.stopPropagation()">Enquire</a>') + '</figcaption></figure>').join('');
}
function category(slug){
  const c = S.categories.find(x => x.slug === slug); if (!c) return portfolio();
  lbList = c.works;
  main.innerHTML = '<section class="page"><div class="crumbs label"><a href="#/portfolio">Portfolio</a><span>/</span><span>' + esc(c.title) + '</span></div><h1>' + esc(c.title) + '</h1>' + (c.intro ? '<p class="intro">' + esc(c.intro) + '</p>' : '') +
    (c.works.length ? '<div class="works">' + figures(c.works) + '</div>' : '<div class="empty">Works in this category are coming soon.</div>') +
    (() => { const i = S.categories.indexOf(c), n = S.categories[(i + 1) % S.categories.length]; return '<div class="nextcat"><span class="label">Next</span><a href="#/portfolio/' + n.slug + '">' + esc(n.title) + '<i></i></a></div>'; })() + '</section>' + foot();
  main.querySelectorAll('figure').forEach(f => { f.addEventListener('click', () => openLb(+f.dataset.i)); f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(+f.dataset.i); } }); });
}
function page(key){
  const p = S.pages[key]; let body = '';
  const text = '<div class="text">' + p.body.map(t => '<p>' + esc(t) + '</p>').join('') + '</div>';
  if (key === 'about'){
    const cv = (p.cv && p.cv.length) ? '<div class="sec"><span class="label">Selected exhibitions and education</span><ul class="cv">' + p.cv.map(r => '<li><span>' + esc(r.year) + '</span><span>' + esc(r.text) + '</span></li>').join('') + '</ul></div>' : '';
    body = '<div class="two">' + text + '<div class="portrait">' + (p.image ? '<img src="' + work(p.image) + '" alt="">' : '') + '</div></div>' + cv;
  } else if (key === 'commission'){
    body = text + '<ol class="steps">' + (p.steps || []).map(s => '<li><b>' + esc(s.t) + '</b><p>' + esc(s.d) + '</p></li>').join('') + '</ol><a class="cta" href="mailto:' + esc(S.email) + '?subject=Commission%20enquiry">' + esc(p.cta || 'Enquire') + '</a>';
  } else if (key === 'shop'){
    const forSale = allWorks().filter(w => w.price); lbList = forSale;
    const avail = forSale.length ? forSale : allWorks(); lbList = avail;
    body = text + '<div class="sec"><span class="label">' + (forSale.length ? 'For sale' : 'Available works, price on enquiry') + '</span></div><div class="works" style="margin-top:40px">' + figures(avail, true) + '</div>';
  } else if (key === 'contact'){
    body = text + '<a class="contact-big" href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>' + (S.instagram ? '<p style="margin:-24px 0 40px"><a class="ul" href="' + esc(S.instagram) + '" target="_blank" rel="noopener">Instagram</a></p>' : '') +
      '<form id="cf"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Message<textarea name="msg" required></textarea></label><div><button class="cta" type="submit">Send</button></div></form><p class="note">Send opens your email app with the message ready to go.</p>';
  }
  main.innerHTML = '<section class="page"><h1>' + esc(p.title) + '</h1>' + body + '</section>' + foot();
  if (key === 'shop') main.querySelectorAll('figure').forEach(f => f.addEventListener('click', () => openLb(+f.dataset.i)));
  const form = document.getElementById('cf');
  if (form) form.addEventListener('submit', e => { e.preventDefault(); const d = new FormData(form); location.href = mailtoFor(d.get('name'), d.get('email'), d.get('msg')); });
}

function mailtoFor(name, email, msg){ return 'mailto:' + S.email + '?subject=' + encodeURIComponent('Message from ' + name) + '&body=' + encodeURIComponent(msg + '\n\n' + name + '\n' + email); }
window.mailtoFor = mailtoFor;
/* lightbox */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap'), lbStrip = document.getElementById('lbStrip');
function openLb(i){ lastFocus = document.activeElement; lbIdx = i; lbStrip.innerHTML = lbList.map((w, k) => '<button data-k="' + k + '" aria-label="Work ' + (k + 1) + '"><img src="' + work(w.file) + '" alt=""></button>').join(''); lbStrip.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { lbIdx = +b.dataset.k; showLb(); })); showLb(); lb.classList.add('open'); document.body.classList.add('lbopen'); document.getElementById('lbClose').focus(); }
function showLb(){ lb.classList.remove('zoom'); const w = lbList[lbIdx]; lbImg.src = work(w.file); lbImg.alt = w.title; lbCap.innerHTML = '<em>' + esc(w.title) + '</em>' + (w.year ? ', ' + esc(w.year) : '') + '<span>' + esc(capOf(w)) + (w.price ? '  ·  ' + esc(w.price) : '') + '</span><span>' + (lbIdx + 1) + ' of ' + lbList.length + '  ·  <a class="ul" href="mailto:' + esc(S.email) + '?subject=' + encodeURIComponent('Enquiry: ' + w.title) + '">Enquire</a>  ·  <span class="zoomhint">Click to zoom</span></span>'; lbStrip.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === lbIdx)); }
function stepLb(d){ lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); }
function closeLb(){ if (!lb.classList.contains('open')) return; lb.classList.remove('open', 'zoom'); document.body.classList.remove('lbopen'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
lbImg.addEventListener('click', e => { const r = lbImg.getBoundingClientRect(); lbImg.style.setProperty('--zx', ((e.clientX - r.left) / r.width * 100) + '%'); lbImg.style.setProperty('--zy', ((e.clientY - r.top) / r.height * 100) + '%'); lb.classList.toggle('zoom'); });
document.getElementById('lbPrev').addEventListener('click', () => stepLb(-1));
document.getElementById('lbNext').addEventListener('click', () => stepLb(1));
document.getElementById('lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('view')) closeLb(); });
</script>
</body>
</html>
